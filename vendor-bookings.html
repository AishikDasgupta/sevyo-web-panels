<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport"
  <link rel="icon" type="image/svg+xml" href="https://media.base44.com/images/public/69c7d609f4ca115f68471b64/5ccb8b120_logo.png"> content="width=device-width, initial-scale=1.0">
  <title>Vendor Bookings — Sevyo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="panel-wrap" data-panel="vendor">
  <div class="main-area" id="mainArea">
    <div class="panel-content">
      <div class="page-header">
        <div><h1>Bookings</h1><p class="subtitle">Manage your agency's bookings and broadcasts</p></div>
      </div>

      <div class="grid grid-cols-4 mb-8" id="bkStats"></div>

      <div class="filter-bar">
        <button class="filter-chip active" onclick="filterBK('all',this)">All</button>
        <button class="filter-chip" onclick="filterBK('broadcast',this)">⚡ Broadcast</button>
        <button class="filter-chip" onclick="filterBK('pending',this)">Pending</button>
        <button class="filter-chip" onclick="filterBK('confirmed',this)">Confirmed</button>
        <button class="filter-chip" onclick="filterBK('in_progress',this)">In Progress</button>
        <button class="filter-chip" onclick="filterBK('completed',this)">Completed</button>
      </div>

      <div class="space-y-3" id="bkList"></div>
    </div>
  </div>

  <script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    initPanel('vendor', 'vendor-bookings.html');
    let activeFilter = 'all';
    // Vendor sees their own + broadcast bookings
    const myBookings = BOOKINGS.filter(b => b.vendorId === CURRENT_VENDOR.id || b.status === 'broadcast');

    document.getElementById('bkStats').innerHTML = [
      { label: 'Broadcast', value: myBookings.filter(b => b.status === 'broadcast').length, icon: '⚡', color: 'amber' },
      { label: 'Pending', value: myBookings.filter(b => b.status === 'pending').length, icon: '⏳', color: 'blue' },
      { label: 'Active', value: myBookings.filter(b => ['confirmed','in_progress'].includes(b.status)).length, icon: '📅', color: 'emerald' },
      { label: 'Completed', value: myBookings.filter(b => b.status === 'completed').length, icon: '✓', color: 'emerald' },
    ].map(k => `<div class="stat-card"><div><p class="stat-label">${k.label}</p><p class="stat-value">${k.value}</p></div><div class="stat-icon ${k.color}" style="font-size:1.25rem">${k.icon}</div></div>`).join('');

    function renderList() {
      const list = activeFilter === 'all' ? myBookings : myBookings.filter(b => b.status === activeFilter);
      document.getElementById('bkList').innerHTML = list.length === 0
        ? `<div class="empty-state"><p class="text-muted">No bookings here.</p></div>`
        : list.map(b => `
          <div class="card flex items-center gap-4" style="padding:1rem 1.25rem">
            <div style="flex:1;min-width:0">
              <div class="flex items-center gap-2 mb-1"><p style="font-weight:600;font-size:.875rem">${b.service}</p>${statusBadge(b.status)}</div>
              <p class="text-xs text-muted">${b.userName} · ${b.address} · ${b.date} ${b.time}</p>
            </div>
            <div class="text-right"><p style="font-weight:700;color:var(--primary)">${fmtINR(b.price)}</p>${b.caregiverName ? `<p class="text-xs text-muted">${b.caregiverName}</p>` : ''}</div>
            ${b.status === 'broadcast' ? `<button class="btn btn-sm btn-accent" onclick="acceptBroadcast('${b.id}')">Accept</button>` : ''}
            ${b.status === 'pending' ? `<button class="btn btn-sm btn-primary" onclick="assignCaregiver('${b.id}')">Assign</button>` : ''}
            ${['confirmed','in_progress'].includes(b.status) ? `<button class="btn btn-sm btn-outline" onclick="toast('Viewing ${b.id}')">View</button>` : ''}
          </div>
        `).join('');
    }
    function filterBK(s, btn) { activeFilter = s; document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active')); btn.classList.add('active'); renderList(); }
    function acceptBroadcast(id) { toast('Broadcast ' + id + ' accepted!'); }
    function assignCaregiver(id) { toast('Assign caregiver to ' + id); }
    renderList();
  </script>
</body>
</html>
