<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport"
  <link rel="icon" type="image/svg+xml" href="https://media.base44.com/images/public/69c7d609f4ca115f68471b64/5ccb8b120_logo.png"> content="width=device-width, initial-scale=1.0">
  <title>Browse Care — Sevyo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="panel-wrap" data-panel="user">
  <div class="main-area" id="mainArea">
    <div class="panel-content">
      <div class="page-header">
        <div><h1>Browse Care</h1><p class="subtitle">Find nurses and caregivers near you</p></div>
      </div>

      <input class="input mb-6" id="searchBox" placeholder="🔍 Search by name, specialization, or type…" oninput="renderGrid()">

      <div class="filter-bar">
        <button class="filter-chip active" onclick="filterType('all',this)">All</button>
        <button class="filter-chip" onclick="filterType('nurse',this)">Nurses</button>
        <button class="filter-chip" onclick="filterType('caregiver',this)">Caregivers</button>
        <button class="filter-chip" onclick="filterType('physiotherapist',this)">Physiotherapists</button>
        <button class="filter-chip" onclick="filterType('elder_care',this)">Elder Care</button>
        <button class="filter-chip" onclick="filterType('pediatric',this)">Pediatric</button>
        <button class="filter-chip" onclick="filterType('mental_health',this)">Mental Health</button>
      </div>

      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))" id="careGrid"></div>
    </div>
  </div>

  <script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    initPanel('user', 'user-browse.html');
    let activeType = 'all';

    function renderGrid() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      let list = CAREGIVERS;
      if (activeType !== 'all') list = list.filter(c => c.type === activeType);
      if (q) list = list.filter(c => c.name.toLowerCase().includes(q) || c.type.replace('_',' ').includes(q) || c.specializations.join(' ').toLowerCase().includes(q));
      document.getElementById('careGrid').innerHTML = list.length === 0
        ? `<div class="empty-state" style="grid-column:1/-1"><p class="text-muted">No caregivers found.</p></div>`
        : list.map(c => `
          <div class="card" style="display:flex;flex-direction:column">
            <div class="flex items-center gap-3 mb-3">
              ${avatarOrInitial(c, 48)}
              <div style="flex:1">
                <p style="font-weight:600">${c.name}</p>
                <p class="text-xs text-muted" style="text-transform:capitalize">${c.type.replace('_',' ')}</p>
              </div>
              ${c.verified ? '<span class="badge badge-verified">✔ Verified</span>' : ''}
            </div>
            <div class="flex items-center gap-2 mb-2">${starsRow(c.rating)}<span class="text-xs text-muted">(${c.reviews})</span></div>
            <p class="text-xs text-muted mb-2" style="flex:1">${c.specializations.join(' · ')}</p>
            <div class="flex items-center justify-between mb-3">
              <span class="text-sm font-semibold">${fmtINR(c.price)}/hr</span>
              <span class="badge ${c.available ? 'badge-active' : 'badge-inactive'}">${c.available ? 'Available' : 'Busy'}</span>
            </div>
            <div class="flex gap-2">
              <a href="user-caregiver-detail.html?id=${c.id}" class="btn btn-sm btn-outline" style="flex:1;text-align:center">View</a>
              <a href="user-booking.html?id=${c.id}" class="btn btn-sm btn-primary" style="flex:1;text-align:center">Book</a>
            </div>
          </div>
        `).join('');
    }
    function filterType(t, btn) { activeType = t; document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active')); btn.classList.add('active'); renderGrid(); }

    // Preselect from query param
    (function() {
      const t = getQueryParam('type');
      if (t) { activeType = t; document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active')); }
      const q = getQueryParam('q');
      if (q) { document.getElementById('searchBox').value = q; }
    })();
    renderGrid();
  </script>
</body>
</html>
