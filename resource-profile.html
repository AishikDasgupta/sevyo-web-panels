<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport"
  <link rel="icon" type="image/svg+xml" href="https://media.base44.com/images/public/69c7d609f4ca115f68471b64/5ccb8b120_logo.png"> content="width=device-width, initial-scale=1.0">
  <title>My Profile — Sevyo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="panel-wrap" data-panel="resource">
  <div class="main-area" id="mainArea">
    <div class="panel-content">
      <div class="page-header">
        <div><h1>My Profile</h1><p class="subtitle">Caregiver profile and availability</p></div>
        <button class="btn btn-primary" id="saveBtn" onclick="saveProfile()">Save Changes</button>
      </div>

      <div class="max-w-md">
        <div class="card mb-6 flex items-center gap-4">
          ${avatarOrInitial(CURRENT_CAREGIVER, 64)}
          <div>
            <h3 style="font-size:1.125rem" id="profileName">${CURRENT_CAREGIVER.name}</h3>
            <p class="text-sm text-muted" id="profileVendor">${CURRENT_CAREGIVER.vendor}</p>
            <p class="text-xs text-muted mt-1" style="text-transform:capitalize">${CURRENT_CAREGIVER.type.replace('_',' ')} · ${CURRENT_CAREGIVER.experience} yrs</p>
          </div>
        </div>

        <div class="card space-y-4">
          <div><label class="field-label">Full Name</label><input class="input" id="fName" value="${CURRENT_CAREGIVER.name}"></div>
          <div><label class="field-label">Phone</label><input class="input" id="fPhone" value="+91 98765 43210"></div>
          <div><label class="field-label">Price/hr (₹)</label><input class="input" type="number" id="fPrice" value="${CURRENT_CAREGIVER.price}"></div>
          <div><label class="field-label">Specializations (comma separated)</label><input class="input" id="fSpecs" value="${CURRENT_CAREGIVER.specializations.join(', ')}"></div>
          <div><label class="field-label">Bio</label><textarea class="textarea" id="fBio">${CURRENT_CAREGIVER.bio}</textarea></div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="fAvail" ${CURRENT_CAREGIVER.available ? 'checked' : ''}>
            <label for="fAvail" class="text-sm">Available for new bookings</label>
          </div>
        </div>

        <button class="btn btn-outline btn-block mt-6" style="color:#e11d48;border-color:#fecdd3" onclick="toast('Signed out')">Sign Out</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    initPanel('resource', 'resource-profile.html');
    function saveProfile() {
      document.getElementById('profileName').textContent = document.getElementById('fName').value;
      toast('Profile saved!');
    }
  </script>
</body>
</html>
