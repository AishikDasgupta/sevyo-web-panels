<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport"
  <link rel="icon" type="image/svg+xml" href="https://media.base44.com/images/public/69c7d609f4ca115f68471b64/5ccb8b120_logo.png"> content="width=device-width, initial-scale=1.0">
  <title>Visit Log — Sevyo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="panel-wrap" data-panel="resource">
  <div class="main-area" id="mainArea">
    <div class="panel-content">
      <div class="page-header">
        <div><h1>Visit Log</h1><p class="subtitle" id="logSubtitle">Completed visits</p></div>
      </div>

      <div class="grid grid-cols-3 mb-8" id="logStats"></div>
      <div class="space-y-3" id="logList"></div>
    </div>
  </div>

  <script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    initPanel('resource', 'resource-visit-log.html');
    const myCompleted = BOOKINGS.filter(b => b.caregiverId === CURRENT_CAREGIVER.id && b.status === 'completed');
    const completed = myCompleted.length ? myCompleted : BOOKINGS.filter(b => b.status === 'completed');
    const earnings = completed.filter(b => b.paymentStatus === 'paid').reduce((s,b) => s + b.price, 0);
    document.getElementById('logSubtitle').textContent = `${completed.length} completed visits · ${fmtINR(earnings)} earned`;

    document.getElementById('logStats').innerHTML = [
      { label: 'Total Visits', value: completed.length, icon: '✓', color: 'emerald' },
      { label: 'Total Earned', value: fmtINR(earnings), icon: '💰', color: 'amber' },
      { label: 'All Bookings', value: BOOKINGS.filter(b => b.caregiverId === CURRENT_CAREGIVER.id).length || BOOKINGS.length, icon: '📋', color: 'blue' },
    ].map(k => `<div class="stat-card"><div><p class="stat-label">${k.label}</p><p class="stat-value">${k.value}</p></div><div class="stat-icon ${k.color}" style="font-size:1.25rem">${k.icon}</div></div>`).join('');

    document.getElementById('logList').innerHTML = completed.length === 0
      ? `<div class="empty-state"><p class="text-muted">No completed visits yet.</p></div>`
      : completed.map(b => `
        <div class="card flex items-start gap-4">
          <div style="width:2.5rem;height:2.5rem;border-radius:.625rem;background:#ecfdf5;color:#059669;display:flex;align-items:center;justify-content:center;flex-shrink:0">✓</div>
          <div style="flex:1">
            <div class="flex items-center gap-2 mb-1"><p style="font-weight:600;font-size:.875rem">${b.service}</p>${statusBadge(b.status)}</div>
            <p class="text-xs text-muted">Patient: ${b.userName}</p>
            <p class="text-xs text-muted">${b.date} ${b.time}</p>
          </div>
          <div class="text-right"><p style="font-weight:700;color:var(--primary)">${fmtINR(b.price)}</p>${statusBadge(b.paymentStatus)}</div>
        </div>
      `).join('');
  </script>
</body>
</html>
