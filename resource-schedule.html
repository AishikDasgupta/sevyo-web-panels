<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport"
  <link rel="icon" type="image/svg+xml" href="https://media.base44.com/images/public/69c7d609f4ca115f68471b64/5ccb8b120_logo.png"> content="width=device-width, initial-scale=1.0">
  <title>Caregiver Schedule — Sevyo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="panel-wrap" data-panel="resource">
  <div class="main-area" id="mainArea">
    <div class="panel-content">
      <div class="page-header">
        <div><h1>Schedule</h1><p class="subtitle">Upcoming and past visits</p></div>
      </div>
      <div id="scheduleList" class="space-y-4"></div>
    </div>
  </div>

  <script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    initPanel('resource', 'resource-schedule.html');
    const myBookings = BOOKINGS.filter(b => b.caregiverId === CURRENT_CAREGIVER.id && b.status !== 'cancelled');
    const allBookings = (myBookings.length ? myBookings : BOOKINGS.filter(b => b.status !== 'cancelled'));
    // Group by date
    const groups = {};
    allBookings.forEach(b => { (groups[b.date] = groups[b.date] || []).push(b); });
    const sortedDates = Object.keys(groups).sort();

    document.getElementById('scheduleList').innerHTML = sortedDates.length === 0
      ? `<div class="empty-state"><p class="text-muted">No scheduled visits.</p></div>`
      : sortedDates.map(date => `
        <div class="card card-pad-lg">
          <h3 style="font-size:1rem;margin-bottom:1rem">${date}</h3>
          <div class="space-y-3">
            ${groups[date].map(b => `
              <div class="flex items-center gap-3 pb-3 border-b" style="border-color:var(--border)">
                <div style="width:3rem;text-align:center"><p style="font-weight:700;font-size:.875rem">${b.time}</p></div>
                <div style="flex:1"><p style="font-weight:600;font-size:.875rem">${b.service}</p><p class="text-xs text-muted">${b.userName} · ${b.address}</p></div>
                ${statusBadge(b.status)}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
  </script>
</body>
</html>
