<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport"
  <link rel="icon" type="image/svg+xml" href="https://media.base44.com/images/public/69c7d609f4ca115f68471b64/5ccb8b120_logo.png"> content="width=device-width, initial-scale=1.0">
  <title>Admin Caregivers — Sevyo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="panel-wrap" data-panel="admin">
  <div class="main-area" id="mainArea">
    <div class="panel-content">
      <div class="page-header">
        <div><h1>Caregivers</h1><p class="subtitle">All registered healthcare professionals</p></div>
      </div>

      <div class="filter-bar">
        <button class="filter-chip active" onclick="filterCaregivers('all',this)">All</button>
        <button class="filter-chip" onclick="filterCaregivers('nurse',this)">Nurses</button>
        <button class="filter-chip" onclick="filterCaregivers('caregiver',this)">Caregivers</button>
        <button class="filter-chip" onclick="filterCaregivers('physiotherapist',this)">Physiotherapists</button>
        <button class="filter-chip" onclick="filterCaregivers('elder_care',this)">Elder Care</button>
        <button class="filter-chip" onclick="filterCaregivers('pediatric',this)">Pediatric</button>
      </div>

      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))" id="caregiverGrid"></div>
    </div>
  </div>

  <script src="js/data.js"></script><script src="js/app.js"></script>
  <script>
    initPanel('admin', 'admin-caregivers.html');
    let activeFilter = 'all';

    function renderGrid() {
      const list = activeFilter === 'all' ? CAREGIVERS : CAREGIVERS.filter(c => c.type === activeFilter);
      document.getElementById('caregiverGrid').innerHTML = list.map(c => `
        <div class="card">
          <div class="flex items-center gap-3 mb-3">
            ${avatarOrInitial(c, 48)}
            <div style="flex:1">
              <p style="font-weight:600">${c.name}</p>
              <p class="text-xs text-muted">${c.vendor}</p>
            </div>
            ${c.verified ? '<span class="badge badge-verified">Verified</span>' : '<span class="badge badge-unverified">Unverified</span>'}
          </div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-muted" style="text-transform:capitalize">${c.type.replace('_',' ')}</span>
            <span style="color:#fbbf24">★ ${c.rating} (${c.reviews})</span>
          </div>
          <p class="text-xs text-muted mb-3">${c.experience} yrs · ${fmtINR(c.price)}/hr</p>
          <div class="flex gap-2">
            <button class="btn btn-sm btn-outline" onclick="toast('Viewing ${c.name}')">View</button>
            ${!c.verified ? `<button class="btn btn-sm btn-primary" onclick="toast('${c.name} verified')">Verify</button>` : ''}
          </div>
        </div>
      `).join('');
    }
    function filterCaregivers(type, btn) {
      activeFilter = type;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    }
    renderGrid();
  </script>
</body>
</html>
